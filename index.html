<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#050505">
    <title>Cítara de Connes TODA</title>
    <style>
        body { background: #050505; color: #00ffcc; font-family: monospace; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #startBtn { width: 100%; height: 100vh; background: #050505; color: #00ffcc; border: 2px solid #00ffcc; font-size: 1.5rem; cursor: pointer; z-index: 1000; position: fixed; }
        .header { padding: 15px; text-align: center; border-bottom: 1px solid #333; font-size: 0.8rem; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 15px; flex-grow: 1; }
        .key { background: #111; border: 1px solid #333; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; transition: 0.1s; -webkit-tap-highlight-color: transparent; }
        .key:active { background: #00ffcc; color: #000; transform: scale(0.9); }
    </style>
</head>
<body>

<button id="startBtn">TOCAR LA RED L11<br><small>(Pulsa para iniciar)</small></button>

<div class="header">CÍTARA DE CONNES v2.0 | S_E = 137 ln(28)</div>
<div class="grid" id="board"></div>

<script>
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    let prevOp = 1;
    const kInf = 0.001515;

    document.getElementById('startBtn').onclick = function() {
        ctx.resume();
        this.style.display = 'none';
    };

    function playOp(n) {
        if (ctx.state === 'suspended') ctx.resume();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        let freq = 137.036 * (1 + Math.log(n));
        let mod = 1.0 + (n - prevOp) / 28.0;
        freq *= mod;
        prevOp = n;

        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(freq * (1 - kInf), now + 0.6);
        
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);

        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(now + 0.6);
    }

    const board = document.getElementById('board');
    for(let i=1; i<=28; i++) {
        const el = document.createElement('div');
        el.className = 'key';
        el.innerText = i;
        const tri = i % 3;
        el.style.borderColor = tri === 0 ? '#ff0055' : (tri === 1 ? '#00ffcc' : '#ffcc00');
        el.onpointerdown = (e) => { e.preventDefault(); playOp(i); };
        board.appendChild(el);
    }
</script>
</body>
</html>
